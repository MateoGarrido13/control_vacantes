spring.application.name=vacante
server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JDBC URL. Accepts jdbc:postgresql://... or the Supabase URI postgresql://user:pass@host/db
# Optional: SUPABASE_DB_USERNAME / SUPABASE_DB_PASSWORD if they are not inside the URI.
# Profile `local` (application-local.properties) uses Docker Postgres and ignores this.
# Empty default so unit tests without the env var still load (Render always sets it).
spring.datasource.url=${SUPABASE_DB_URL:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000

# Hibernate 7 cannot pick a dialect if the first JDBC handshake fails.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
