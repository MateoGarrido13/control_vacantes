name: control-vacantes
services:
  ui:
    build: ./frontend
    ports:
      - "3000:3000"
    # The Spring Boot API must be listening on the host at port 8080.
    environment:
      - BACKEND_HOST=host.docker.internal
      - BACKEND_PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
