name: control-vacantes
services:
  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: vacantes
      POSTGRES_USER: vacantes
      POSTGRES_PASSWORD: vacantes
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vacantes -d vacantes"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - vacantes_pg:/var/lib/postgresql/data

  ui:
    build: ./frontend
    ports:
      - "3000:3000"
    # The Spring Boot API must be listening on the host at port 8080.
    environment:
      - BACKEND_HOST=host.docker.internal
      - BACKEND_PORT=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  vacantes_pg:
